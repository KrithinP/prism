[project]
name = "prism"
version = "0.1.0"
description = "Middle-fusion RGB-thermal detection: an empirical architecture study on KAIST"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Blackwell (sm_120) needs CUDA 12.8+ wheels; anything older dies at runtime with
    # "no kernel image is available for execution on the device". Pinned via the index below.
    "torch>=2.11",
    "torchvision>=0.26",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "loguru>=0.7",
    "tabulate>=0.9",
    "pycocotools>=2.0.8",
    "wandb>=0.17",
    "thop>=0.1.1",           # params / FLOPs accounting — a reported column, not an afterthought
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "ipykernel>=6.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prism"]

[tool.ruff]
line-length = 100

# Pull torch/torchvision from the CUDA 12.8 index, not PyPI. Without this, a fresh
# `uv pip install -e .` silently grabs a default-CUDA wheel that cannot run on sm_120.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
