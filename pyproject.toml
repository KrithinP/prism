[project]
name = "prism"
version = "0.1.0"
description = "Middle-fusion RGB-thermal detection: an empirical architecture study on KAIST"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "loguru>=0.7",
    "tabulate>=0.9",
    "pycocotools>=2.0.8",
    "wandb>=0.17",
    "thop>=0.1.1",           # params / FLOPs accounting — a reported column, not an afterthought
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "ipykernel>=6.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prism"]

[tool.ruff]
line-length = 100
